apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ucnnct-mock-rollout-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ucnnct/ucnnct-mock-gitops.git
    targetRevision: main
    path: platform/rollout/install
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
