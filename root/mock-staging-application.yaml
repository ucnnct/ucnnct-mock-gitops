apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ucnnct-mock-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      name: worker-service
      namespace: ucnnct-mock
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas
    - group: apps
      kind: Deployment
      name: worker-service
      namespace: ucnnct-mock
      jsonPointers:
        - /spec/replicas
  source:
    repoURL: https://github.com/ucnnct/ucnnct-mock-gitops.git
    targetRevision: main
    path: apps/overlay/staging
  destination:
    server: https://172.31.253.146:6443
    namespace: ucnnct-mock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
