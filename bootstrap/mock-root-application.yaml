apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ucnnct-mock-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ucnnct/ucnnct-mock-gitops.git
    targetRevision: main
    path: root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
