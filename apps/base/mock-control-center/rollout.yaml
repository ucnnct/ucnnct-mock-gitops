apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mock-control-center
  labels:
    app.kubernetes.io/name: mock-control-center
    app.kubernetes.io/part-of: ucnnct-mock
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-control-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-control-center
        app.kubernetes.io/part-of: ucnnct-mock
    spec:
      containers:
        - name: mock-control-center
          image: ghcr.io/ucnnct/mock-control-center:0.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
  strategy:
    blueGreen:
      activeService: mock-control-center
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
