# https://argoproj.github.io/argo-rollouts/features/kustomize/
nameReference:
- kind: ConfigMap
  version: v1
  fieldSpecs:
  - path: spec/template/spec/volumes/configMap/name
    kind: Rollout
  - path: spec/template/spec/containers/env/valueFrom/configMapKeyRef/name
    kind: Rollout
  - path: spec/template/spec/initContainers/env/valueFrom/configMapKeyRef/name
    kind: Rollout
  - path: spec/template/spec/containers/envFrom/configMapRef/name
    kind: Rollout
  - path: spec/template/spec/initContainers/envFrom/configMapRef/name
    kind: Rollout
  - path: spec/template/spec/volumes/projected/sources/configMap/name
    kind: Rollout
- kind: Secret
  version: v1
  fieldSpecs:
  - path: spec/template/spec/volumes/secret/secretName
    kind: Rollout
  - path: spec/template/spec/containers/env/valueFrom/secretKeyRef/name
    kind: Rollout
  - path: spec/template/spec/initContainers/env/valueFrom/secretKeyRef/name
    kind: Rollout
  - path: spec/template/spec/containers/envFrom/secretRef/name
    kind: Rollout
  - path: spec/template/spec/initContainers/envFrom/secretRef/name
    kind: Rollout
  - path: spec/template/spec/imagePullSecrets/name
    kind: Rollout
  - path: spec/template/spec/volumes/projected/sources/secret/name
    kind: Rollout
- kind: ServiceAccount
  version: v1
  fieldSpecs:
  - path: spec/template/spec/serviceAccountName
    kind: Rollout
- kind: PersistentVolumeClaim
  version: v1
  fieldSpecs:
  - path: spec/template/spec/volumes/persistentVolumeClaim/claimName
    kind: Rollout
- kind: PriorityClass
  version: v1
  group: scheduling.k8s.io
  fieldSpecs:
  - path: spec/template/spec/priorityClassName
    kind: Rollout
- kind: Service
  version: v1
  fieldSpecs:
  - path: spec/strategy/blueGreen/activeService
    kind: Rollout
  - path: spec/strategy/blueGreen/previewService
    kind: Rollout
  - path: spec/strategy/canary/canaryService
    kind: Rollout
  - path: spec/strategy/canary/stableService
    kind: Rollout
  - path: spec/strategy/canary/trafficRouting/alb/rootService
    kind: Rollout
- kind: Ingress
  group: networking.k8s.io
  fieldSpecs:
  - path: spec/strategy/canary/trafficRouting/alb/ingress
    kind: Rollout
  - path: spec/strategy/canary/trafficRouting/nginx/stableIngress
    kind: Rollout
- kind: Rollout
  fieldSpecs:
  - path: spec/scaleTargetRef/name
    kind: HorizontalPodAutoscaler
- kind: Deployment
  version: v1
  group: apps
  fieldSpecs:
  - path: spec/workloadRef/name
    kind: Rollout
commonLabels:
- path: spec/selector/matchLabels
  create: true
  kind: Rollout
- path: spec/template/metadata/labels
  create: true
  kind: Rollout
commonAnnotations:
- path: spec/template/metadata/annotations
  create: true
  kind: Rollout
varReference:
- path: spec/template/spec/containers/args
  kind: Rollout
- path: spec/template/spec/containers/command
  kind: Rollout
- path: spec/template/spec/containers/env/value
  kind: Rollout
- path: spec/template/spec/containers/volumeMounts/mountPath
  kind: Rollout
- path: spec/template/spec/initContainers/args
  kind: Rollout
- path: spec/template/spec/initContainers/command
  kind: Rollout
- path: spec/template/spec/initContainers/env/value
  kind: Rollout
- path: spec/template/spec/initContainers/volumeMounts/mountPath
  kind: Rollout
replicas:
- path: spec/replicas
  create: true
  kind: Rollout
