apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  labels:
    app.kubernetes.io/name: worker-service
    app.kubernetes.io/part-of: ucnnct-mock
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-service
        app.kubernetes.io/part-of: ucnnct-mock
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker-service
      containers:
        - name: worker-service
          image: ghcr.io/ucnnct/mock-worker-service:0.1.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mock-user-service-config
            - secretRef:
                name: mock-user-service-secrets
            - secretRef:
                name: staging-auth-bootstrap
                optional: true
          env:
            - name: PORT
              value: "7400"
            - name: WORKER_TICK_MS
              value: "500"
            - name: BROWSER_AUTH_CONCURRENCY
              value: "1"
            - name: WS_BOOTSTRAP_CONCURRENCY
              value: "1"
            - name: STAGING_AUTH_BOOTSTRAP_MODE
              value: "redis-session"
            - name: WS_MANAGER_DIRECT_URLS
              value: "ws://172.31.253.170:32081/ws/uconnect,ws://172.31.249.27:32081/ws/uconnect,ws://172.31.253.199:32081/ws/uconnect,ws://172.31.249.200:32081/ws/uconnect,ws://172.31.249.152:32081/ws/uconnect,ws://172.31.249.164:32081/ws/uconnect"
            - name: WS_RELAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: staging-ws-relay-secret
                  key: WS_RELAY_SHARED_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 7400
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
