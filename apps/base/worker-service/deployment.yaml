apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  labels:
    app.kubernetes.io/name: worker-service
    app.kubernetes.io/part-of: ucnnct-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-service
        app.kubernetes.io/part-of: ucnnct-mock
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      nodeSelector:
        workload: mock-workers
      tolerations:
        - key: dedicated
          operator: Equal
          value: mock-workers
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker-service
      containers:
        - name: worker-service
          image: ghcr.io/ucnnct/mock-worker-service:0.1.0
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "7400"
          ports:
            - name: http
              containerPort: 7400
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
