apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: ucnnct-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/part-of: ucnnct-mock
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/ucnnct/mock-orchestrator:0.1.0
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "7300"
            - name: WORKER_SERVICE_ORIGIN
              value: http://worker-service:7400
            - name: MOCK_USER_SERVICE_ORIGIN
              value: http://mock-user-service:7500
          ports:
            - name: http
              containerPort: 7300
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
