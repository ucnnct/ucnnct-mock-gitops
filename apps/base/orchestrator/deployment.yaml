apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/part-of: ucnnct-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        app.kubernetes.io/part-of: ucnnct-mock
    spec:
      serviceAccountName: orchestrator
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: orchestrator
          image: ghcr.io/ucnnct/mock-orchestrator:0.1.0
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "7300"
            - name: WORKER_SERVICE_ORIGIN
              value: http://worker-service:7400
            - name: MOCK_USER_SERVICE_ORIGIN
              value: http://mock-user-service:7500
            - name: K8S_NAMESPACE
              value: ucnnct-mock
            - name: WORKER_DEPLOYMENT_NAME
              value: worker-service
            - name: WORKER_HPA_NAME
              value: worker-service
            - name: WORKER_LABEL_SELECTOR
              value: app.kubernetes.io/name=worker-service
            - name: WORKER_SHARD_SIZE
              value: "100"
            - name: WORKER_MIN_REPLICAS
              value: "2"
            - name: WORKER_MAX_REPLICAS
              value: "100"
            - name: MAX_VIRTUAL_USERS
              value: "10000"
            - name: STAGING_CLUSTER_NAMESPACE
              value: staging
            - name: STAGING_CLUSTER_API_URL
              valueFrom:
                secretKeyRef:
                  name: staging-cluster-reader
                  key: server
                  optional: true
            - name: STAGING_CLUSTER_CA_BASE64
              valueFrom:
                secretKeyRef:
                  name: staging-cluster-reader
                  key: ca.crt
                  optional: true
            - name: STAGING_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: staging-cluster-reader
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 7300
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
