apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-user-service
  labels:
    app.kubernetes.io/name: mock-user-service
    app.kubernetes.io/part-of: ucnnct-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-user-service
        app.kubernetes.io/part-of: ucnnct-mock
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: mock-user-service
          image: ghcr.io/ucnnct/mock-user-service:0.1.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mock-user-service-config
            - secretRef:
                name: mock-user-service-secrets
          env:
            - name: SERVER_PORT
              value: "7500"
          ports:
            - name: http
              containerPort: 7500
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 3000m
              memory: 3Gi
