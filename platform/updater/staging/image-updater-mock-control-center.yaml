apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: ucnnct-mock-staging-image-updater-mock-control-center
  namespace: argocd
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: 'regexp:^v?[0-9]+\.[0-9]+\.[0-9]+$'
    pullSecret: pullsecret:argocd/ghcr-credentials
  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      repository: https://github.com/ucnnct/ucnnct-mock-gitops.git
      writeBackTarget: kustomization:./mock-control-center
  applicationRefs:
    - namePattern: ucnnct-mock-staging
      images:
        - alias: mockcontrolcenter
          imageName: ghcr.io/ucnnct/mock-control-center
          commonUpdateSettings:
            forceUpdate: true
          manifestTargets:
            kustomize:
              name: ghcr.io/ucnnct/mock-control-center
